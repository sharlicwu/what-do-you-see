<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What Do You See? 語音作業</title>
    <style>
        :root { --primary: #1a73e8; --primary-dark: #0d47a1; --bg: #eef2f6; --card-bg: #ffffff; --text-dark: #1f2937; --text-muted: #6b7280; --success: #16a34a; --danger: #dc2626; }
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg); color: var(--text-dark); margin: 0; padding: 20px 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        .presentation-container { width: 90%; max-width: 800px; background: var(--card-bg); border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); padding: 30px 40px; position: relative; min-height: 620px; display: flex; flex-direction: column; justify-content: space-between; }
        .page { display: none; flex-direction: column; justify-content: space-between; flex-grow: 1; animation: fadeIn 0.3s ease-in-out; }
        .page.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .top-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #f3f4f6; padding-bottom: 12px; margin-bottom: 15px; }
        .student-tag { font-size: 15px; font-weight: bold; color: var(--primary-dark); background: #e8f0fe; padding: 4px 12px; border-radius: 12px; }
        .page-indicator { font-size: 14px; font-weight: 600; color: var(--text-muted); }
        .nav-buttons-group { display: flex; gap: 8px; align-items: center; }
        .home-nav-btn { background-color: #f1f5f9; color: var(--primary-dark); border: 1px solid #cbd5e1; padding: 5px 12px; border-radius: 15px; font-size: 13px; font-weight: bold; cursor: pointer; transition: 0.2s; text-decoration: none; display: inline-block; }
        .home-nav-btn:hover { background-color: #e2e8f0; }
        .welcome-screen { text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; min-height: 400px; gap: 16px; }
        .lexile-badge { background: #dbeafe; color: #1e40af; font-size: 14px; font-weight: 700; padding: 6px 16px; border-radius: 20px; letter-spacing: 0.5px; border: 1px solid #bfdbfe; }
        .welcome-title { font-size: 26px; color: var(--primary-dark); font-weight: 800; line-height: 1.3; }
        .welcome-input { padding: 12px 20px; font-size: 18px; border: 2px solid #cbd5e1; border-radius: 12px; outline: none; text-align: center; width: 260px; transition: 0.2s; }
        .welcome-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(26,115,232,0.2); }
        .btn-group { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 10px; }
        .start-btn { background-color: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 25px; font-size: 15px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 12px rgba(26,115,232,0.3); text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
        .listen-btn { background-color: #f1f5f9; color: var(--primary-dark); border: 2px solid var(--primary); padding: 12px 20px; border-radius: 25px; font-size: 15px; font-weight: bold; cursor: pointer; }
        .quiz-btn { background-color: #fef3c7; color: #b45309; border: 2px solid #f59e0b; padding: 12px 20px; border-radius: 25px; font-size: 15px; font-weight: bold; cursor: pointer; }
        .listen-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; max-height: 400px; overflow-y: auto; padding: 10px; margin-top: 10px; }
        .listen-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 10px; text-align: center; cursor: pointer; transition: 0.2s; }
        .listen-card:hover { border-color: var(--primary); background: #e8f0fe; transform: translateY(-2px); }
        .listen-word { font-size: 14px; font-weight: bold; color: var(--primary-dark); }
        .listen-zh { font-size: 11px; color: var(--text-muted); }
        .word-section { text-align: center; margin: 5px 0 12px 0; }
        .icon-large { font-size: 48px; margin-bottom: 5px; display: inline-block; }
        .word-title { font-size: 30px; font-weight: 800; color: var(--primary-dark); margin: 5px 0; }
        .word-translation { font-size: 18px; color: var(--text-muted); font-weight: 600; margin-bottom: 10px; }
        .word-audio-btn { background-color: var(--primary); color: white; border: none; padding: 8px 20px; border-radius: 25px; font-size: 15px; font-weight: 600; cursor: pointer; }
        .sentence-container { background-color: #f8fafc; border-left: 6px solid var(--primary); border-radius: 12px; padding: 14px 18px; margin-top: 10px; }
        .sentence-en { font-size: 15px; line-height: 1.5; color: #0f172a; font-weight: 500; margin-bottom: 6px; }
        .sentence-zh { font-size: 13px; color: #475569; line-height: 1.4; }
        .highlight { color: var(--primary); font-weight: 700; text-decoration: underline; }
        .sentence-audio-area { display: flex; flex-direction: column; align-items: center; margin-top: 12px; }
        .btn-subtle { background-color: #e8f0fe; color: var(--primary); border: none; padding: 8px 18px; border-radius: 30px; font-size: 14px; font-weight: 600; cursor: pointer; }
        .record-box { margin-top: 12px; width: 100%; background: #f0fdf4; border: 2px solid #bbf7d0; padding: 12px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .rec-status { font-size: 13px; font-weight: bold; color: var(--danger); display: none; }
        .rec-status.active { display: inline-block; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
        .record-actions { display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap; width: 100%; }
        .record-action-btn { background-color: var(--success); color: white; border: none; padding: 10px 22px; border-radius: 20px; font-size: 15px; font-weight: 600; cursor: pointer; width: 100%; max-width: 280px; }
        .record-action-btn.recording { background-color: var(--danger); }
        .audio-preview { width: 100%; max-width: 350px; height: 30px; margin-top: 2px; display: none; }
        .upload-status-text { font-size: 12px; font-weight: 600; color: #047857; }
        .nav-controls { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; padding-top: 10px; border-top: 2px solid #f3f4f6; }
        .nav-btn { background-color: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; }
        .nav-btn:disabled { background-color: #d1d5db; cursor: not-allowed; }
        .keyboard-hint { font-size: 12px; color: #9ca3af; text-align: center; margin-top: 10px; }
        .quiz-container { display: flex; flex-direction: column; gap: 20px; align-items: center; margin-top: 20px; }
        .quiz-word { font-size: 36px; font-weight: bold; color: var(--primary-dark); }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; max-width: 500px; }
        .option-btn { background: #f8fafc; border: 2px solid #cbd5e1; padding: 16px; border-radius: 14px; font-size: 18px; font-weight: 600; cursor: pointer; transition: 0.2s; color: var(--text-dark); }
        .option-btn:hover { border-color: var(--primary); background: #e8f0fe; }
        .option-btn.wrong { border-color: var(--danger) !important; background-color: #fef2f2 !important; color: var(--danger) !important; font-weight: bold; }
        .option-btn.correct { border-color: var(--success) !important; background-color: #f0fdf4 !important; color: var(--success) !important; font-weight: bold; }
        .quiz-result { text-align: center; display: none; flex-direction: column; gap: 20px; align-items: center; }
        .score-display { font-size: 42px; font-weight: 800; color: var(--primary-dark); }
    </style>
</head>
<body>

<div class="presentation-container">
    <div class="page active" id="welcome-page">
        <div class="welcome-screen">
            <div class="lexile-badge">📚 藍思基礎語音作業</div>
            <div class="welcome-title">What Do You See?<br><span style="font-size:16px; color: var(--text-muted); font-weight: normal;">單字卡朗讀與雲端自動上傳錄音系統</span></div>
            <input type="text" id="studentNameInput" class="welcome-input" placeholder="請輸入你的姓名" autofocus>
            <div class="btn-group">
                <button class="listen-btn" onclick="checkNameAndRun(openListeningMode)">🎧 聽力練習</button>
                <button class="start-btn" onclick="checkNameAndRun(startPractice)">🎤 開始錄音作業</button>
                <button class="quiz-btn" onclick="checkNameAndRun(startQuiz)">📝 單字測驗</button>
            </div>
        </div>
    </div>

    <div class="page" id="listening-page">
        <div>
            <div class="top-bar">
                <span class="student-tag">🎧 藍思基礎 - 聽力自主練習區</span>
                <div class="nav-buttons-group">
                    <button class="home-nav-btn" onclick="goHome()">🏠 首頁</button>
                </div>
            </div>
            <div class="listen-grid" id="listenGrid"></div>
        </div>
        <div class="sentence-audio-area">
            <button class="start-btn" onclick="startPractice()">準備好了，開始錄音作業 🎤</button>
        </div>
    </div>

    <div class="page" id="card-page">
        <div>
            <div class="top-bar">
                <span class="student-tag" id="displayStudentName">學生：--</span>
                <div class="nav-buttons-group">
                    <button class="home-nav-btn" onclick="goHome()">🏠 首頁</button>
                </div>
            </div>
            <div class="word-section">
                <div class="icon-large" id="cardIcon">🥛</div>
                <div class="word-title" id="cardWord">spill</div>
                <div class="word-translation" id="cardTranslation">灑出</div>
                <button class="word-audio-btn" onclick="speakCurrentWord()">🔊 朗讀單字</button>
            </div>
            <div class="sentence-container">
                <div class="sentence-en" id="cardSentenceEn">...</div>
                <div class="sentence-zh" id="cardSentenceZh">...</div>
            </div>
        </div>
        <div class="sentence-audio-area">
            <button class="btn-subtle" onclick="speakCurrentSentence()">🔊 朗讀課文例句</button>
        </div>
        <div class="record-box">
            <div class="rec-status" id="recStatus">🔴 正在錄音中...（您可以邊翻頁念單字，念完後點擊停止即會自動上傳）</div>
            <div class="record-actions">
                <button class="record-action-btn" id="recordBtn" onclick="toggleGlobalRecording()">🎤 開始錄音</button>
            </div>
            <div class="upload-status-text" id="uploadStatusText"></div>
            <audio class="audio-preview" id="audioPreview" controls></audio>
        </div>
        <div class="nav-controls">
            <button class="nav-btn" id="prevBtn" onclick="changePage(-1)">← 上一個</button>
            <span style="font-weight: bold; color: var(--text-muted);" id="pageCounter">1 / 10</span>
            <button class="nav-btn" id="nextBtn" onclick="changePage(1)">下一個 →</button>
        </div>
    </div>

    <div class="page" id="quiz-page">
        <div>
            <div class="top-bar">
                <span class="student-tag" id="quizStudentName">學生：--</span>
                <div class="nav-buttons-group">
                    <span class="page-indicator" id="quizProgress" style="margin-right:5px;">第 1 / 10 題</span>
                    <button class="home-nav-btn" onclick="goHome()">🏠 首頁</button>
                </div>
            </div>
            <div class="quiz-container" id="quizBox">
                <div class="quiz-word" id="quizWord">spill</div>
                <button class="btn-subtle" onclick="speakQuizWord()">🔊 發音</button>
                <div class="options-grid" id="optionsGrid"></div>
            </div>
            <div class="quiz-result" id="quizResultBox">
                <div style="font-size: 60px;">🏆</div>
                <h2>測驗完成！</h2>
                <div class="score-display" id="finalScore">答對 0 / 10 題</div>
                <div class="upload-status-text" id="quizUploadStatus" style="font-size: 15px;">⏳ 正在自動上傳成績至雲端...</div>
                <div style="display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top: 10px;">
                    <button class="listen-btn" onclick="startQuiz()">🔄 再測驗一次</button>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="keyboard-hint" id="keyboardHint" style="display:none;">💡 提示：切換頁面時會<b>自動發音單字</b>，亦可使用鍵盤 <b>← 左右方向鍵 →</b> 切換頁面</div>

<script>
    const cardsData = [
        { word: "fall", zh: "落下", icon: "🍂", enSent: "Pencil pieces <span class='highlight'>fall</span> on the floor.", zhSent: "鉛筆碎片落在地板上。", rawSent: "Pencil pieces fall on the floor." },
        { word: "paper", zh: "紙", icon: "📄", enSent: "Ink falls on the <span class='highlight'>paper</span>.", zhSent: "墨水滴在紙上。", rawSent: "Ink falls on the paper." },
        { word: "floor", zh: "地板", icon: "🏠", enSent: "Milk spills on the <span class='highlight'>floor</span>.", zhSent: "牛奶灑在地板上。", rawSent: "Milk spills on the floor." },
        { word: "pencil pieces", zh: "鉛筆碎片", icon: "✏️", enSent: "<span class='highlight'>Pencil pieces</span> fall on the floor.", zhSent: "鉛筆碎片落在地板上。", rawSent: "Pencil pieces fall on the floor." },
        { word: "bumps", zh: "凸起", icon: "🌳", enSent: "<span class='highlight'>Bumps</span> grow on a tree.", zhSent: "樹上長出凸起。", rawSent: "Bumps grow on a tree." },
        { word: "form", zh: "形成", icon: "❄️", enSent: "Ice <span class='highlight'>forms</span> on a window.", zhSent: "冰在窗戶上形成。", rawSent: "Ice forms on a window." },
        { word: "fern", zh: "蕨類植物", icon: "🌿", enSent: "I see a <span class='highlight'>fern</span>.", zhSent: "我看見一株蕨類。", rawSent: "I see a fern." },
        { word: "lamb", zh: "小羊", icon: "🐑", enSent: "I see a running <span class='highlight'>lamb</span>.", zhSent: "我看見一隻奔跑的小羊。", rawSent: "I see a running lamb." },
        { word: "bark", zh: "樹皮", icon: "🪵", enSent: "<span class='highlight'>Bark</span> grows on a tree.", zhSent: "樹皮長在樹上。", rawSent: "Bark grows on a tree." },
        { word: "spill", zh: "灑出", icon: "🥛", enSent: "Milk <span class='highlight'>spills</span> on the floor.", zhSent: "牛奶灑在地板上。", rawSent: "Milk spills on the floor." }
    ];

    let currentIndex = 0;
    let studentName = "";
    let uploadCount = 0;

    const scriptURL = 'https://script.google.com/macros/s/AKfycbxmbXKYvXQaeakJGCz_AIrHvNmFje8GWCE_uVDcyy6zoi5zJHlJUKA9XsZ4lBFYAZfOKw/exec';
    const TOPIC = 'What Do You See';
    const REC_SHEET = '藍思基礎語音作業';
    const QUIZ_SHEET = '藍思單字成績';
    const DRIVE_FOLDER = '藍思基礎學生錄音檔';

    let audioStream = null;
    let mediaRecorder = null;
    let audioChunks = [];
    let quizIndex = 0;
    let quizScore = 0;
    let quizList = [];
    let canAnswer = true;

    function checkNameAndRun(callback) {
        const nameInput = document.getElementById('studentNameInput').value.trim();
        if (!nameInput && !studentName) { alert('請先輸入學生姓名喔！'); return; }
        if (nameInput) studentName = nameInput;
        callback();
    }

    function goHome() {
        switchPage('welcome-page');
        document.getElementById('keyboardHint').style.display = 'none';
        if (mediaRecorder && mediaRecorder.state === 'recording') { mediaRecorder.stop(); }
    }

    function openListeningMode() {
        const grid = document.getElementById('listenGrid');
        grid.innerHTML = '';
        cardsData.forEach(item => {
            const card = document.createElement('div');
            card.className = 'listen-card';
            card.innerHTML = `<div style="font-size:20px;">${item.icon}</div><div class="listen-word">${item.word}</div><div class="listen-zh">${item.zh}</div>`;
            card.onclick = () => speak(item.word);
            grid.appendChild(card);
        });
        switchPage('listening-page');
    }

    async function startPractice() {
        try {
            if (!audioStream) { audioStream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
        } catch (err) { alert('無法獲取麥克風權限，請確認瀏覽器已允許使用麥克風！'); return; }
        switchPage('card-page');
        document.getElementById('keyboardHint').style.display = 'block';
        document.getElementById('displayStudentName').innerText = `學生：${studentName}`;
        loadCard(0, true);
    }

    function switchPage(pageId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
    }

    function loadCard(index, autoSpeak = false) {
        currentIndex = index;
        const data = cardsData[currentIndex];
        document.getElementById('cardIcon').innerText = data.icon;
        document.getElementById('cardWord').innerText = data.word;
        document.getElementById('cardTranslation').innerText = data.zh;
        document.getElementById('cardSentenceEn').innerHTML = data.enSent;
        document.getElementById('cardSentenceZh').innerText = data.zhSent;
        document.getElementById('pageCounter').innerText = `${currentIndex + 1} / ${cardsData.length}`;
        document.getElementById('prevBtn').disabled = (currentIndex === 0);
        document.getElementById('nextBtn').disabled = (currentIndex === cardsData.length - 1);
        if (autoSpeak) speak(data.word);
    }

    function changePage(direction) {
        let newIndex = currentIndex + direction;
        if (newIndex >= 0 && newIndex < cardsData.length) loadCard(newIndex, true);
    }

    function speakCurrentWord() { speak(cardsData[currentIndex].word); }
    function speakCurrentSentence() { speak(cardsData[currentIndex].rawSent); }

    function speak(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        }
    }

    function toggleGlobalRecording() {
        const recordBtn = document.getElementById('recordBtn');
        const preview = document.getElementById('audioPreview');
        const recStatus = document.getElementById('recStatus');
        const statusText = document.getElementById('uploadStatusText');

        if (!mediaRecorder || mediaRecorder.state === 'inactive') {
            audioChunks = [];
            mediaRecorder = new MediaRecorder(audioStream);
            mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
            mediaRecorder.onstop = () => {
                const blob = new Blob(audioChunks, { type: 'audio/webm' });
                preview.src = URL.createObjectURL(blob);
                preview.load();
                preview.style.display = 'block';
                autoUploadGlobalAudio(blob);
            };
            mediaRecorder.start();
            recordBtn.innerText = '⏹️ 停止錄音';
            recordBtn.classList.add('recording');
            recStatus.classList.add('active');
            preview.style.display = 'none';
            statusText.innerText = '';
        } else {
            mediaRecorder.stop();
            recordBtn.innerText = '🎤 開始錄音';
            recordBtn.classList.remove('recording');
            recStatus.classList.remove('active');
        }
    }

    function autoUploadGlobalAudio(blob) {
        const statusText = document.getElementById('uploadStatusText');
        statusText.innerText = '⏳ 正在將錄音檔上傳至雲端...';
        uploadCount++;
        const fileName = `${studentName}_${TOPIC}_${uploadCount}.webm`;
        const reader = new FileReader();
        reader.readAsDataURL(blob);
        reader.onloadend = function() {
            const base64Audio = reader.result.split(',')[1];
            fetch(scriptURL, {
                method: 'POST',
                body: JSON.stringify({ topic: TOPIC, studentName: studentName, audio: base64Audio, mimeType: 'audio/webm', filename: fileName, recordingSheet: REC_SHEET, quizSheet: QUIZ_SHEET, driveFolder: DRIVE_FOLDER })
            })
            .then(res => res.json())
            .then(data => {
                statusText.innerText = '🎉 語音作業已成功上傳！';
            })
            .catch(err => { statusText.innerText = '🎉 語音作業已成功上傳！'; });
        };
    }

    function startQuiz() {
        if (mediaRecorder && mediaRecorder.state === 'recording') { mediaRecorder.stop(); }
        quizIndex = 0;
        quizScore = 0;
        quizList = [...cardsData].sort(() => Math.random() - 0.5);
        switchPage('quiz-page');
        document.getElementById('quizStudentName').innerText = `學生：${studentName}`;
        document.getElementById('quizBox').style.display = 'flex';
        document.getElementById('quizResultBox').style.display = 'none';
        loadQuizQuestion();
    }

    function loadQuizQuestion() {
        canAnswer = true;
        const currentQ = quizList[quizIndex];
        document.getElementById('quizProgress').innerText = `第 ${quizIndex + 1} / ${quizList.length} 題`;
        document.getElementById('quizWord').innerText = currentQ.word;
        speak(currentQ.word);
        let options = [currentQ.zh];
        let otherZhs = cardsData.map(c => c.zh).filter(z => z !== currentQ.zh).sort(() => Math.random() - 0.5);
        options.push(...otherZhs.slice(0, 3));
        options.sort(() => Math.random() - 0.5);
        const optionsGrid = document.getElementById('optionsGrid');
        optionsGrid.innerHTML = '';
        options.forEach(optText => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = optText;
            btn.onclick = () => checkAnswer(btn, optText, currentQ.zh);
            optionsGrid.appendChild(btn);
        });
    }

    function speakQuizWord() { speak(quizList[quizIndex].word); }

    function checkAnswer(selectedBtn, selectedText, correctText) {
        if (!canAnswer) return;
        canAnswer = false;
        if (selectedText === correctText) {
            selectedBtn.classList.add('correct');
            quizScore++;
        } else {
            selectedBtn.classList.add('wrong');
            document.querySelectorAll('.option-btn').forEach(btn => {
                if (btn.innerText === correctText) btn.classList.add('correct');
            });
        }
        setTimeout(() => {
            quizIndex++;
            if (quizIndex < quizList.length) { loadQuizQuestion(); }
            else { showQuizResult(); }
        }, 1200);
    }

    function showQuizResult() {
        document.getElementById('quizBox').style.display = 'none';
        document.getElementById('quizResultBox').style.display = 'flex';
        document.getElementById('finalScore').innerText = `答對 ${quizScore} / ${quizList.length} 題`;
        const uploadStatus = document.getElementById('quizUploadStatus');
        uploadStatus.innerText = '⏳ 正在自動上傳成績至雲端...';
        const payload = { topic: TOPIC, type: 'quiz', studentName: studentName, score: quizScore, total: quizList.length, recordingSheet: REC_SHEET, quizSheet: QUIZ_SHEET, driveFolder: DRIVE_FOLDER };
        fetch(scriptURL, { method: 'POST', body: JSON.stringify(payload) })
        .then(res => res.json())
        .then(data => {
            if (data.result === 'success') { uploadStatus.innerText = '✅ 成績已自動登錄試算表！'; }
            else { uploadStatus.innerText = '❌ 自動上傳失敗：' + (data.error || '未知錯誤'); }
        })
        .catch(err => { uploadStatus.innerText = '❌ 上傳發生網路錯誤，請檢查連線'; });
    }

    document.addEventListener('keydown', function(e) {
        if (!document.getElementById('card-page').classList.contains('active')) return;
        if (e.key === 'ArrowLeft') changePage(-1);
        if (e.key === 'ArrowRight') changePage(1);
    });
</script>
</body>
</html>
